active_embed: ollama-embed
active_llm: ollama
reranker_llm: bge-rernaker-v2
# 안전망: bge-rernaker-v2 는 base_url 이 placeholder 라 지금은 연결 실패 →
# 이 fallback(ollama, 기존 LLM 프롬프트 채점)으로 자동 재시도되어 분석은
# 정상 동작한다. 사내에서 base_url 을 실제 vLLM 호스트로 교체하면 그때부터
# rerank 엔드포인트가 우선 시도되고, 실패 시에도 이 fallback 이 계속 보호한다.
reranker_fallback_llm: ollama
embed_profiles:
- api_key: ollama
  base_url: http://localhost:11434/v1
  model: bge-m3
  name: ollama-embed
llm_profiles:
- api_key: ollama
  base_url: http://localhost:11434/v1
  max_tokens: 65535
  model: qwen3.5:35b
  name: ollama
  provider: openai
  report_temperature: 0.2
  timeout: null
# vLLM rerank 엔드포인트 프로필 — Document/Reranker 전용 엔드포인트 도입/ 참조.
# base_url 은 placeholder 다. 사내에서 실제 vLLM 호스트로 교체하고, Phase 0
# (경로가 정말 /v1/rerank 인지, 응답이 {"results":[{"index","relevance_score"}]}
# 형태인지)을 실호출로 확인한 뒤 사용할 것 — 그 전까지는 위 reranker_fallback_llm
# 이 이 프로필의 연결 실패를 흡수해 분석을 계속 동작시킨다.
- api_key: ""
  base_url: http://<vllm-host>:<port>/v1   # TODO: 사내 실제 vLLM 호스트로 교체
  rerank_path: /rerank                      # 실효 경로 = base_url + rerank_path = .../v1/rerank
  model: bjson/bge-reranker-base:latest
  name: bge-rernaker-v2
  provider: vllm-rerank
pipeline:
  context_strategy: truncation
  definite_threshold: 0.5
  hybrid_overflow_ratio: 0.3
  kb_threshold: 0.7
  # rerank 엔드포인트 전용 threshold — cross-encoder 점수 분포가 LLM 의
  # 0~1 관련성 점수와 달라 kb_threshold 와 스케일이 다르다. 지금은 kb_threshold
  # 와 같은 잠정값 — 실제 vLLM 으로 대표 케이스를 채점해 분포를 실측한 뒤
  # (Phase 4) 재보정할 것. 그 전까지 프로덕션 판정 기준으로 신뢰하지 말 것.
  rerank_threshold: 0.7
  max_log_lines: 2000
  moe_per_expert_stage1: true
  moe_relevance_floor: 0.4
  moe_traversal_mode: ensemble
  moe_window_size: 3
  num_ctx: 198000
  observability_enabled: true
  stage6_reflection_enabled: false
  unknown_refine_mode: current
  chip_match_mode: weight
server:
  max_workers: 10
  job_ttl_minutes: 60
  job_cleanup_interval: 300
bedrock:
  aws_region: ap-northeast-2
  ca_cert: /usr/local/share/ca-certificates/samsungsemi-prx.com.crt
  proxy_url: http://12.26.204.100:8080
system_analysis_guidelines: '당신은 리눅스 커널로그를 분석합니다. 다음을 준수합니다.

  - 로그에 직접적 근거가 없는 내용은 분석에 포함하지 않는다

  - 명확한 근거가 없는 것은 분석에 포함하지 않는다.

  - 그럼에도 불구하고, 추측성 판단이 필요한 경우, 추측성 판단은 별도 구분하여 표시한다

  - 각 분석 항목에 반드시 evidence 로그 라인을 명시한다

  - 판정은 제공된 score와 매칭 결과에 기반한다'
