workspace: ./workspace

# 사용자 로그 추가(user-logs)의 src_path 허용 루트 목록.
# '~'는 backend 구동 계정의 홈으로 확장되며, 상대 경로는 backend 디렉토리 기준.
# 비어 있거나 없으면 모든 user-logs 추가 요청을 차단한다.
# 여러 사용자가 쓰는 환경에서는 모두가 쓰기 가능한 공유 폴더 경로로 교체할 것 (예: /data/share).
user_log_roots:
  - "~"

puller_client:
  no_proxy: true   # httpx는 no_proxy CIDR를 지원하지 않으므로 Puller 요청은 프록시를 경유하지 않도록 설정
  # TLS 검증 설정 (환경별로 조정):
  #   ca_cert 지정   → 해당 파일을 CA로 신뢰 (사설 CA HTTPS 환경, 상대 경로는 backend 기준)
  #   ca_cert 미지정 → 시스템 CA 저장소 사용 (공인 인증서 또는 http Puller 환경)
  #   verify: false  → 검증 비활성 (테스트 환경 전용)
  ca_cert: certs/server.crt

pullers:
  - name: "Corp Puller"
    url: "https://127.0.0.1:8000"
    site_name: "Pulling description and attached files"
    async_fetch: true
analyzing_assistants:
  active: "Analyzing Assistant V2"
  items:
    - name: "Analyzing Assistant V1"
      url: "http://127.0.0.1:8010"
      api_key: abcd1234
    - name: "Analyzing Assistant V2"
      url: "http://127.0.0.1:8020"
      api_key: abcd1234
