# default_patterns.yaml
#
# 앱 최초 실행 시 SQLite 에 seed 되는 기본 패턴 목록.
# UI(4페이지)에서 수정한 내용은 DB 에만 반영되며 이 파일은 변경되지 않는다.
# "기본값 초기화" 기능은 이 파일을 다시 읽어 DB 를 덮어쓴다.
#
# 필드 공통 설명:
#   name        : 고유 식별자 (COMPOSITE 의 components 에서 참조)
#   type        : PRESENCE | SEQUENCE | WINDOW | ABSENCE | COMPOSITE
#   description : 사람이 읽는 설명
#   keywords    : Stage 3 재필터링에 사용할 키워드 목록
#   weight      : 점수 계산 가중치  score = Σ(weight×matched) / Σ(weight)
#   is_required : true 이면 미매칭 시 케이스 즉시 제외

patterns:

  # ── PRESENCE ─────────────────────────────────────────────────────────────────
  # 특정 패턴이 로그에 한 번 이상 등장하는지 확인한다.
  # event_dedup_window_sec: 이 초 안에 같은 fingerprint 가 반복되면 1회로 계산

  - name: "커널 패닉"
    type: PRESENCE
    description: "커널 패닉 발생 — 시스템 비정상 종료"
    keywords: ["panic"]
    pattern: "kernel panic - not syncing"
    event_dedup_window_sec: null
    weight: 2.0
    is_required: true

  - name: "OOM Killer 동작"
    type: PRESENCE
    description: "메모리 부족으로 OOM Killer 가 프로세스를 종료함"
    keywords: ["oom", "memory"]
    pattern: "Out of memory: Kill process|oom_kill_process"
    event_dedup_window_sec: 60.0
    weight: 1.5
    is_required: false

  - name: "EXT4 오류"
    type: PRESENCE
    description: "EXT4 파일시스템 오류 감지"
    keywords: ["ext4"]
    pattern: "EXT4-fs error"
    event_dedup_window_sec: 30.0
    weight: 1.2
    is_required: false

  # ── SEQUENCE ─────────────────────────────────────────────────────────────────
  # 지정한 패턴들이 이 순서대로 등장하는지 확인한다.
  # step_dedup    : 각 step 안에서 fingerprint 중복 제거 후 매칭
  # non_overlapping: 이전 시퀀스와 겹치는 구간은 새 시퀀스 시작으로 인정하지 않음

  - name: "ATA 리셋 시퀀스"
    type: SEQUENCE
    description: "ATA 명령 오류 → 실패 → 링크 리셋 순서로 발생"
    keywords: ["ata"]
    steps:
      - "exception Emask"
      - "failed command"
      - "hard resetting link"
    step_dedup: true
    non_overlapping: true
    weight: 1.0
    is_required: false

  - name: "NVMe 초기화 실패 시퀀스"
    type: SEQUENCE
    description: "NVMe 컨트롤러 리셋 후 초기화 실패"
    keywords: ["nvme"]
    steps:
      - "controller is down"
      - "Abort command id"
      - "failed to set APST feature"
    step_dedup: false
    non_overlapping: false
    weight: 1.3
    is_required: false

  # ── WINDOW ───────────────────────────────────────────────────────────────────
  # window_sec 안에 pattern 이 count_threshold 회 이상 등장하는지 확인한다.
  # count_unique_only: fingerprint 기준 중복 제거 후 횟수 계산

  - name: "단시간 다수 ATA 오류"
    type: WINDOW
    description: "10초 내 ATA 오류 5회 이상 — 디바이스 불안정"
    keywords: ["ata"]
    pattern: "ata.*exception|ata.*error"
    window_sec: 10.0
    count_threshold: 5
    count_unique_only: true
    weight: 1.2
    is_required: false

  - name: "단시간 다수 I/O 오류"
    type: WINDOW
    description: "30초 내 블록 디바이스 I/O 오류 10회 이상"
    keywords: ["blk", "io"]
    pattern: "blk_update_request.*I/O error"
    window_sec: 30.0
    count_threshold: 10
    count_unique_only: false
    weight: 1.0
    is_required: false

  # ── ABSENCE ──────────────────────────────────────────────────────────────────
  # trigger_pattern 등장 후 window_sec 안에 absent_pattern 이 나타나지 않으면 매칭.

  - name: "ATA EH 미완료"
    type: ABSENCE
    description: "ATA 오류 처리(EH) 시작 후 30초 내 완료 메시지 없음"
    keywords: ["ata"]
    trigger_pattern: "ata.*: EH in port_reset"
    absent_pattern: "ata.*: EH complete"
    window_sec: 30.0
    weight: 0.8
    is_required: false

  - name: "디스크 언마운트 미완료"
    type: ABSENCE
    description: "umount 시도 후 60초 내 완료 로그 없음"
    keywords: ["ext4", "umount"]
    trigger_pattern: "EXT4-fs.*: unmounting filesystem"
    absent_pattern: "EXT4-fs.*: unmounted filesystem"
    window_sec: 60.0
    weight: 0.7
    is_required: false

  # ── COMPOSITE ────────────────────────────────────────────────────────────────
  # 다른 패턴들을 AND / OR / NOT 으로 조합한다.
  # components 의 값은 이 파일 내 다른 패턴의 name 이어야 한다.
  # NOT 은 components 를 정확히 1개만 가져야 한다.
  # COMPOSITE 는 항상 파일 아래쪽(참조 대상보다 뒤)에 작성한다.

  - name: "ATA 복합 장애"
    type: COMPOSITE
    description: "ATA 리셋 시퀀스와 단시간 다수 오류가 동시에 발생"
    keywords: ["ata"]
    operator: AND
    components:
      - "ATA 리셋 시퀀스"
      - "단시간 다수 ATA 오류"
    weight: 2.0
    is_required: false

  - name: "스토리지 심각 장애"
    type: COMPOSITE
    description: "ATA 복합 장애 또는 NVMe 초기화 실패"
    keywords: ["ata", "nvme"]
    operator: OR
    components:
      - "ATA 복합 장애"
      - "NVMe 초기화 실패 시퀀스"
    weight: 2.5
    is_required: false
