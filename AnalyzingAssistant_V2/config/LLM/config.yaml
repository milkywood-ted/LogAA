active_embed: ollama-embed
active_llm: ollama
reranker_fallback_llm:
embed_profiles:
- api_key: ollama
  base_url: http://localhost:11434/v1
  model: bge-m3
  name: ollama-embed
llm_profiles:
- api_key: ollama
  base_url: http://localhost:11434/v1
  max_tokens: 65535
  model: qwen3.5:35b
  name: ollama
  provider: openai
  report_temperature: 0.2
  timeout: null
pipeline:
  context_strategy: truncation
  definite_threshold: 0.5
  hybrid_overflow_ratio: 0.3
  kb_threshold: 0.7
  max_log_lines: 2000
  moe_per_expert_stage1: true
  moe_relevance_floor: 0.4
  moe_traversal_mode: ensemble
  moe_window_size: 3
  num_ctx: 198000
  observability_enabled: true
  stage6_reflection_enabled: false
server:
  max_workers: 10
  job_ttl_minutes: 60
  job_cleanup_interval: 300
system_analysis_guidelines: '당신은 리눅스 커널로그를 분석합니다. 다음을 준수합니다.

  - 로그에 직접적 근거가 없는 내용은 분석에 포함하지 않는다

  - 명확한 근거가 없는 것은 분석에 포함하지 않는다.

  - 그럼에도 불구하고, 추측성 판단이 필요한 경우, 추측성 판단은 별도 구분하여 표시한다

  - 각 분석 항목에 반드시 evidence 로그 라인을 명시한다

  - 판정은 제공된 score와 매칭 결과에 기반한다'
